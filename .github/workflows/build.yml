name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android scaffold
        run: flutter create --org com.deepinnovations --project-name call_history --platforms=android .

      - name: Copy our app files
        run: |
          rm -rf test
          cp app_src/pubspec.yaml pubspec.yaml
          cp app_src/lib/main.dart lib/main.dart
          cp app_src/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/deepinnovations/call_history
          cp app_src/android/kotlin/*.kt android/app/src/main/kotlin/com/deepinnovations/call_history/

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: call-history-apk
          path: build/app/outputs/flutter-apk/app-release.apk
